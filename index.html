<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Proxy Browser</title>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- UV Scripts (Modules) -->
    <script src="/active/uv/uv.bundle.js" defer></script>
    <script src="/active/uv/uv.config.js" defer></script>

    <!-- Scramjet Scripts (MUST be classic scripts) -->
    <script src="/scramjet/scramjet.js"></script>
    <script src="/controller/controller.api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@3.0.1/dist/index.js"></script>

    <style>
        :root {
            --bg-dark: #0f0f11;
            --bg-panel: #1a1a1d;
            --bg-input: #252529;
            --text-main: #f0f0f0;
            --text-muted: #888890;
            --border-color: #2d2d33;
            --accent: #4f82f2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            width: 100vw; height: 100vh;
            background-color: var(--bg-dark); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- Title & Tabs Bar --- */
        .tabs-container {
            display: flex; align-items: flex-end; background-color: var(--bg-dark);
            height: 40px; padding: 0 8px; gap: 4px; border-bottom: 1px solid var(--border-color);
        }
        .tab {
            display: flex; align-items: center; gap: 8px;
            height: 32px; padding: 0 12px; min-width: 120px; max-width: 220px;
            background-color: transparent; color: var(--text-muted);
            border-radius: 8px 8px 0 0; cursor: pointer;
            font-size: 12px; border: 1px solid transparent; border-bottom: none;
            position: relative; transition: background 0.2s;
        }
        .tab:hover { background-color: rgba(255, 255, 255, 0.05); }
        .tab.active {
            background-color: var(--bg-panel); color: var(--text-main);
            border-color: var(--border-color); border-bottom: 1px solid var(--bg-panel);
            margin-bottom: -1px; z-index: 2;
        }
        .tab-title { flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tab-close {
            display: flex; align-items: center; justify-content: center;
            width: 18px; height: 18px; border-radius: 50%; opacity: 0; transition: opacity 0.2s;
        }
        .tab:hover .tab-close, .tab.active .tab-close { opacity: 1; }
        .tab-close:hover { background-color: rgba(255,255,255,0.1); }
        
        .new-tab-btn {
            display: flex; align-items: center; justify-content: center;
            width: 28px; height: 28px; border-radius: 6px; cursor: pointer; color: var(--text-muted);
            background: transparent; border: none; margin-bottom: 2px;
        }
        .new-tab-btn:hover { background-color: rgba(255,255,255,0.05); color: var(--text-main); }

        /* --- Navigation Bar --- */
        .nav-bar {
            display: flex; align-items: center; gap: 12px;
            height: 48px; padding: 0 12px; background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color); z-index: 1;
        }
        .nav-actions { display: flex; gap: 4px; }
        .icon-btn {
            background: transparent; border: none; color: var(--text-main);
            width: 32px; height: 32px; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: background 0.2s;
        }
        .icon-btn:hover { background-color: rgba(255,255,255,0.1); }

        .url-bar {
            flex-grow: 1; display: flex; align-items: center; gap: 8px;
            background-color: var(--bg-input); border: 1px solid var(--border-color);
            border-radius: 20px; height: 32px; padding: 0 16px;
        }
        .url-bar input {
            flex-grow: 1; background: transparent; border: none; color: var(--text-main);
            font-size: 13px; outline: none; width: 100%;
        }

        /* --- Engine & WISP Controls --- */
        .proxy-controls { display: flex; gap: 8px; align-items: center; }
        .control-select {
            background-color: var(--bg-input); color: var(--text-main);
            border: 1px solid var(--border-color); border-radius: 6px;
            padding: 4px 8px; font-size: 11px; outline: none; cursor: pointer; height: 28px;
        }
        .wisp-status { font-size: 11px; color: var(--text-muted); min-width: 80px; text-align: right; }

        /* --- Main Content Area --- */
        .content-area { flex-grow: 1; position: relative; background-color: #ffffff; }
        iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: none; display: none; background-color: #ffffff;
        }
        iframe.active { display: block; }
    </style>
</head>
<body>

    <!-- Tabs Area -->
    <div class="tabs-container" id="tabs-container">
        <!-- Tabs inserted here -->
        <button class="new-tab-btn" onclick="addNewTab('about:blank', 'New Tab')">
            <i data-lucide="plus" size="18"></i>
        </button>
    </div>

    <!-- Navigation Area -->
    <div class="nav-bar">
        <div class="nav-actions">
            <button class="icon-btn" onclick="document.querySelector('iframe.active')?.contentWindow.history.back()"><i data-lucide="arrow-left" size="18"></i></button>
            <button class="icon-btn" onclick="document.querySelector('iframe.active')?.contentWindow.history.forward()"><i data-lucide="arrow-right" size="18"></i></button>
            <button class="icon-btn" onclick="document.querySelector('iframe.active')?.contentWindow.location.reload()"><i data-lucide="rotate-cw" size="16"></i></button>
        </div>
        
        <div class="url-bar">
            <i data-lucide="lock" size="14" color="#888890"></i>
            <input type="text" id="url-input" placeholder="Search Google or type a URL" autocomplete="off">
        </div>

        <div class="proxy-controls">
            <select class="control-select" id="engine-select">
                <option value="scramjet">Scramjet</option>
                <option value="uv">Ultraviolet</option>
            </select>
            <select class="control-select" id="wisp-select">
                <option value="auto">Auto WISP</option>
                <option value="wss://onyxv1.ai.studio/wisp/">onyxv1</option>
                <option value="wss://reverse.myapl.org/wisp/">reverse</option>
                <option value="wss://inkmath.adijaya.id/wisp/">inkmath</option>
            </select>
            <div class="wisp-status" id="wisp-status">Standby</div>
        </div>
    </div>

    <!-- Iframe Container -->
    <div class="content-area" id="iframe-container"></div>

    <script type="module">
        import * as BareMux from "/active/prxy/baremux/index.mjs";

        lucide.createIcons();

        // Core Proxy Configurations
        const connection = new BareMux.BareMuxConnection("/active/prxy/baremux/worker.js");
        const WISP_URLS = [
            "wss://onyxv1.ai.studio/wisp/",
            "wss://reverse.myapl.org/wisp/",
            "wss://inkmath.adijaya.id/wisp/"
        ];

        let swReady = null;
        let cachedWisp = null;
        let scramjetController = null;
        
        // Tab State
        let tabs = [];
        let activeTabId = null;
        let tabCounter = 0;

        const wispStatusEl = document.getElementById('wisp-status');
        const urlInput = document.getElementById('url-input');

        // --- Proxy Initialization ---
        async function getBestWisp() {
            wispStatusEl.innerText = "Pinging...";
            for (const url of WISP_URLS) {
                try {
                    const ws = new WebSocket(url);
                    await new Promise((resolve, reject) => {
                        ws.onopen = () => { ws.close(); resolve(); };
                        ws.onerror = reject;
                        setTimeout(reject, 2000);
                    });
                    return url;
                } catch (_) {}
            }
            return WISP_URLS[0];
        }

        async function ensureProxyReady() {
            if (!swReady) {
                wispStatusEl.innerText = "SW Init...";
                swReady = navigator.serviceWorker.register("/sw.js");
            }
            await swReady;
            await navigator.serviceWorker.ready;

            const selectedWisp = document.getElementById('wisp-select').value;
            const targetWisp = selectedWisp === 'auto' ? await getBestWisp() : selectedWisp;
            
            if (cachedWisp !== targetWisp) {
                cachedWisp = targetWisp;

                // 1. Setup BareMux (For UV)
                await connection.setTransport("/active/prxy/libcurl/libcurl.mjs", [{ wisp: cachedWisp }]);

                // 2. Setup Scramjet
                const EpoxyTransport = self.EpoxyTransport.default;
                const { Controller } = window.$scramjetController;
                const { defaultConfig } = window.$scramjet;

                const transport = new EpoxyTransport({ wisp: cachedWisp });
                await transport.init();

                const serviceworker = navigator.serviceWorker.controller ?? (await navigator.serviceWorker.ready).active;
                
                scramjetController = new Controller({
                    serviceworker,
                    transport,
                    scramjetConfig: defaultConfig
                });
                await scramjetController.wait();

                // Clear attached frames if WISP changes
                tabs.forEach(t => t.scramjetFrame = null);
            }
            
            wispStatusEl.innerText = new URL(cachedWisp).hostname.split('.')[0];
        }

        document.getElementById('wisp-select').addEventListener('change', () => {
            if (activeTabId) navigateToInput();
        });

        // --- Navigation Logic ---
        function formatUrl(input) {
            if (input === 'about:blank') return input;
            try { return new URL(input).toString(); } catch (e) {}
            try {
                const u = new URL(`https://${input}`);
                if (u.hostname.includes(".")) return u.toString();
            } catch (e) {}
            return "https://www.google.com/search?q=" + encodeURIComponent(input);
        }

        async function navigateFrame(tabId, rawUrl) {
            if (rawUrl === 'about:blank') return;
            
            await ensureProxyReady();
            const engine = document.getElementById('engine-select').value;
            const targetUrl = formatUrl(rawUrl);
            const tab = tabs.find(t => t.id === tabId);
            const iframe = document.getElementById(`frame-${tabId}`);

            if (engine === 'scramjet') {
                if (!tab.scramjetFrame) {
                    tab.scramjetFrame = scramjetController.createFrame(iframe);
                }
                tab.scramjetFrame.go(targetUrl);
            } else if (engine === 'uv') {
                if (typeof __uv$config !== 'undefined') {
                    iframe.src = __uv$config.prefix + __uv$config.encodeUrl(targetUrl);
                } else {
                    console.error("UV config missing");
                }
            }
        }

        // --- Tab Management ---
        window.addNewTab = async function(initialUrl = "about:blank", title = "New Tab") {
            const id = `tab-${tabCounter++}`;
            tabs.push({ id, url: initialUrl, title, scramjetFrame: null });

            const tabContainer = document.getElementById('tabs-container');
            const newTabBtn = document.querySelector('.new-tab-btn');
            
            const tabEl = document.createElement('div');
            tabEl.className = 'tab';
            tabEl.id = `tab-btn-${id}`;
            tabEl.onclick = () => switchTab(id);
            tabEl.innerHTML = `
                <img src="https://www.google.com/s2/favicons?domain=google.com&sz=16" width="14" height="14" style="border-radius:2px;" id="favicon-${id}">
                <div class="tab-title" id="title-${id}">${title}</div>
                <div class="tab-close" onclick="closeTab('${id}', event)"><i data-lucide="x" size="12"></i></div>
            `;
            tabContainer.insertBefore(tabEl, newTabBtn);

            const iframeContainer = document.getElementById('iframe-container');
            const iframe = document.createElement('iframe');
            iframe.id = `frame-${id}`;
            iframeContainer.appendChild(iframe);

            lucide.createIcons();
            switchTab(id);

            if (initialUrl !== 'about:blank') {
                await navigateFrame(id, initialUrl);
            }
        };

        window.switchTab = function(id) {
            activeTabId = id;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('iframe').forEach(i => i.classList.remove('active'));

            document.getElementById(`tab-btn-${id}`).classList.add('active');
            document.getElementById(`frame-${id}`).classList.add('active');

            const tab = tabs.find(t => t.id === id);
            if (tab) {
                urlInput.value = tab.url === 'about:blank' ? '' : tab.url;
            }
        };

        window.closeTab = function(id, event) {
            event.stopPropagation();
            document.getElementById(`tab-btn-${id}`).remove();
            document.getElementById(`frame-${id}`).remove();
            tabs = tabs.filter(t => t.id !== id);

            if (activeTabId === id) {
                if (tabs.length > 0) switchTab(tabs[tabs.length - 1].id);
                else window.addNewTab();
            }
        };

        urlInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter' && activeTabId) {
                await window.navigateToInput();
            }
        });

        window.navigateToInput = async function() {
            if (!activeTabId) return;
            const val = urlInput.value.trim();
            if (!val) return;
            
            const tab = tabs.find(t => t.id === activeTabId);
            tab.url = val;
            tab.title = val;
            document.getElementById(`title-${activeTabId}`).innerText = val;

            // Attempt to update favicon based on domain
            try {
                const domain = new URL(formatUrl(val)).hostname;
                document.getElementById(`favicon-${activeTabId}`).src = `https://www.google.com/s2/favicons?domain=${domain}&sz=16`;
            } catch (e) {}

            await navigateFrame(activeTabId, val);
        };

        // Boot
        ensureProxyReady().then(() => {
            addNewTab("https://google.com", "Google");
        });
    </script>
</body>
</html>
